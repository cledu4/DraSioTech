<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Intrusion Détectée</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <style>
        /* Style sombre pour faire "Hacker" */
        body {
            background-color: #0d1117;
            color: #00ff41; /* Vert Matrix */
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify_content: center;
            overflow: hidden;
        }

        .container {
            max-width: 800px;
            padding: 20px;
            text-align: left;
            border: 1px solid #30363d;
            background: #161b22;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
            border-radius: 6px;
            position: relative;
        }

        /* Effet de scanline (vieux moniteur) */
        .container::before {
            content: "SYSTEM_ERROR: 404_NOT_FOUND";
            position: absolute;
            top: -25px;
            left: 0;
            font-size: 12px;
            color: #ff4444;
            font-weight: bold;
        }

        #terminal-text {
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-wrap; /* Garde les sauts de ligne */
        }

        /* Le curseur qui clignote */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: #00ff41;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Bouton discret */
        .btn-return {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            border: 1px solid #00ff41;
            color: #00ff41;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.9rem;
            opacity: 0; /* Caché au début */
            transition: all 0.3s ease;
        }

        .btn-return:hover {
            background-color: #00ff41;
            color: #000;
            cursor: pointer;
        }

        /* Animation d'apparition du bouton */
        .fade-in {
            animation: fadeIn 2s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="terminal-text"></div><span class="cursor"></span>
        
        <br>
        <a href="/" id="back-btn" class="btn-return">> EXECUTE: RETOUR_ACCUEIL.EXE</a>
    </div>

    <script>
        // LE MESSAGE POUR DONOVAN
        // Tu peux modifier le texte entre les guillemets ci-dessous
        const message = `> Initialisation du protocole de sécurité...
> Scan de l'adresse IP...
> Identité détectée : Suspect.

> Analyse comportementale en cours...
...
...
> Tiens tiens... Donovan ?
> Tu cherches quoi exactement ?
> T'essaies de casser notre site ou t'es juste perdu ?

> T'inquiète pas, on a rien vu.
> Mais retourne bosser maintenant.
> Fin de transmission.`;

        const speed = 50; // Vitesse de frappe (plus petit = plus vite)
        let i = 0;
        const target = document.getElementById("terminal-text");
        const btn = document.getElementById("back-btn");

        function typeWriter() {
            if (i < message.length) {
                target.innerHTML += message.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            } else {
                // Quand le texte est fini, on affiche le bouton
                btn.classList.add("fade-in");
            }
        }

        // Lancement du script au chargement
        window.onload = typeWriter;
    </script>

</body>
</html>
